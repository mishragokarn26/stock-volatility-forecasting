data:
  ticker: AAPL
  start_date: "2015-01-01"
  end_date: null

preprocessing:
  use_log_returns: true
  rolling_window: 21

training:
  train_split: 0.8

models:
  garch:
    p: 1
    q: 1

  ml:
    random_forest:
      n_estimators: 100
      max_depth: 5

    xgboost:
      n_estimators: 200
      learning_rate: 0.05

  lstm:
    epochs: 10
    batch_size: 32

paths:
  raw_data: data/raw
  processed_data: data/processed
  models: models/